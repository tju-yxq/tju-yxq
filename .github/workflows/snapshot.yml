name: Update profile snapshots

on:
  schedule:
    - cron: "0 6 * * *" # daily at 6am UTC
  workflow_dispatch:

jobs:
  snapshot:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Generate contribution snake
        uses: Platane/snk@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        with:
          github_user_name: tju-yxq
          outputs: |
            dist/snake.svg
            dist/snake-dark.svg

      - name: Fetch SVG snapshots
        run: |
          set -euo pipefail
          mkdir -p assets
          tmp_dir=$(mktemp -d)
          trap 'rm -rf "$tmp_dir"' EXIT

          is_valid_svg() {
            local file="$1"
            [ -s "$file" ] && grep -qi "<svg" "$file" && ! grep -qiE "Something went wrong|Rate limit|Could not fetch" "$file"
          }

          fetch_svg() {
            local dest="$1"
            shift
            local tmp_file="$tmp_dir/$(basename "$dest")"
            for url in "$@"; do
              if curl -fsSL --connect-timeout 10 --max-time 30 "$url" -o "$tmp_file" && is_valid_svg "$tmp_file"; then
                mv "$tmp_file" "$dest"
                echo "Updated $dest"
                return 0
              fi
              rm -f "$tmp_file"
            done
            echo "WARNING: Failed to fetch valid SVG for $dest, keeping existing file if present"
            return 0
          }

          # Contribution snake
          for name in snake.svg snake-dark.svg; do
            if [ -f "dist/$name" ] && is_valid_svg "dist/$name"; then
              cp "dist/$name" "assets/$name"
              echo "Updated assets/$name"
            else
              echo "WARNING: dist/$name is missing or invalid, keeping existing file if present"
            fi
          done

          # Typing animation
          fetch_svg "assets/typing.svg" \
            "https://readme-typing-svg.demolab.com?font=Fira+Code&size=22&pause=1200&center=true&vCenter=true&width=500&lines=AI+for+AI+%C2%B7+LLM+Safety+%C2%B7+Multi-Agent;Internet+builder+%26+cyberspace+guardian;Anime+dreamer+%E3%81%8C%E5%A4%A2%E3%82%92%E6%92%AE%E3%82%8B"

          # GitHub Stats card (try primary, fall back to alternate instance)
          fetch_svg "assets/stats.svg" \
            "https://github-readme-stats.vercel.app/api?username=tju-yxq&show_icons=true&theme=tokyonight&hide_border=true&include_all_commits=true&count_private=true" \
            "https://github-readme-stats-eight-theta.vercel.app/api?username=tju-yxq&show_icons=true&theme=tokyonight&hide_border=true&include_all_commits=true&count_private=true"

          # Top Languages
          fetch_svg "assets/top-langs.svg" \
            "https://github-readme-stats.vercel.app/api/top-langs/?username=tju-yxq&layout=compact&theme=tokyonight&hide_border=true" \
            "https://github-readme-stats-eight-theta.vercel.app/api/top-langs/?username=tju-yxq&layout=compact&theme=tokyonight&hide_border=true"

          # Streak stats
          fetch_svg "assets/streak.svg" \
            "https://streak-stats.demolab.com?user=tju-yxq&theme=tokyonight&hide_border=true"

          ls -la assets/

      - name: Commit snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update profile stat snapshots"
            git push
          fi
