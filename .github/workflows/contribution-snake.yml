name: Generate contribution snake

on:
  schedule:
    - cron: "0 0 * * *" # every midnight UTC
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate snake animation
        uses: Platane/snk@v3
        with:
          github_user_name: tju-yxq
          outputs: |
            dist/snake.svg
            dist/snake-dark.svg

      - name: Push to output branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global --unset credential.helper || true
          mkdir -p /tmp/output
          cp dist/snake.svg /tmp/output/
          cp dist/snake-dark.svg /tmp/output/ 2>/dev/null || true
          cd /tmp/output
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "chore: update contribution snake"
          git branch -M output
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"
          git push --force origin output
